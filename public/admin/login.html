<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login — Kannada Riders Garage 14</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/theme.css"/>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 50%, rgba(230,57,70,0.12) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 30%, rgba(255,107,43,0.08) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-container {
      width: 100%;
      max-width: 440px;
      position: relative;
      z-index: 1;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand .garage-icon {
      font-size: 2.5rem;
      display: block;
      margin-bottom: 8px;
    }

    .login-brand h1 {
      font-size: 1.5rem;
      color: var(--text-primary);
    }

    .login-brand .subtitle {
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4px;
    }

    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-xl);
      padding: 36px 32px;
      position: relative;
      overflow: hidden;
    }

    .login-box::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #e63946, #ff6b2b, #f4a926);
    }

    .login-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .role-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(230,57,70,0.12);
      border: 1px solid rgba(230,57,70,0.3);
      color: #ff7b87;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .forgot-link {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-align: right;
      display: block;
      margin-top: -12px;
      margin-bottom: 20px;
    }
    .forgot-link:hover { color: var(--accent-orange); }

    .back-link {
      text-align: center;
      margin-top: 20px;
      font-size: 0.875rem;
      color: var(--text-muted);
    }
    .back-link a { color: var(--accent-orange); }

    .security-note {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,107,43,0.06);
      border: 1px solid rgba(255,107,43,0.15);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <span class="garage-icon">🏍️</span>
      <h1 class="gradient-text">Kannada Riders Garage 14</h1>
      <p class="subtitle">Management System</p>
    </div>

    <div class="login-box">
      <div class="login-heading">
        <span class="role-badge">🛡️ Admin</span>
        <h2 style="font-size:1.3rem;">Administrator Login</h2>
      </div>

      <div id="alert" class="alert"></div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="identifier">Email or Username</label>
          <input
            type="text"
            id="identifier"
            name="identifier"
            class="form-control"
            placeholder="admin@kannadariders.com"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button type="button" class="input-group-icon" data-toggle-password="password">👁</button>
          </div>
        </div>

        <a href="#" class="forgot-link" id="forgotBtn">Forgot password?</a>

        <button type="submit" class="btn btn-danger btn-full btn-lg" id="submitBtn">
          🔐 Login as Admin
        </button>
      </form>

      <div class="security-note">
        🔒 This portal is restricted to authorized administrators only.
      </div>

      <div class="back-link">
        <a href="/">← Back to Home</a>
      </div>
    </div>
  </div>

  <div id="toast-container"></div>
  <script src="/js/app.js"></script>
  <script>
    const form       = document.getElementById('loginForm');
    const submitBtn  = document.getElementById('submitBtn');
    const alertEl    = document.getElementById('alert');
    const forgotBtn  = document.getElementById('forgotBtn');

    // Redirect if already logged in as admin
    (async () => {
      try {
        const { ok, data } = await API.get('/auth/me');
        if (ok && data.user && data.user.role === 'admin') {
          window.location.href = '/admin/dashboard';
        }
      } catch(e) {}
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      FormUtils.hideAlert(alertEl);

      const identifier = document.getElementById('identifier').value.trim();
      const password   = document.getElementById('password').value;

      if (!identifier || !password) {
        FormUtils.showAlert(alertEl, 'Please enter your credentials.');
        return;
      }

      FormUtils.setLoading(submitBtn, true);
      try {
        const { ok, data } = await API.post('/auth/admin/login', { identifier, password });
        if (ok && data.success) {
          Toast.success('Welcome back, ' + data.user.full_name + '!');
          setTimeout(() => window.location.href = '/admin/dashboard', 800);
        } else {
          const msg = data.errors ? data.errors[0].msg : (data.message || 'Login failed.');
          FormUtils.showAlert(alertEl, msg);
          FormUtils.setLoading(submitBtn, false);
        }
      } catch (err) {
        FormUtils.showAlert(alertEl, 'Connection error. Please try again.');
        FormUtils.setLoading(submitBtn, false);
      }
    });

    forgotBtn.addEventListener('click', (e) => {
      e.preventDefault();
      Toast.warning('Please contact your system administrator to reset your password.');
    });
  </script>
</body>
</html>
